# Cloudflare named tunnel — REBA
# Dominio: rebaserver.tech (.tech gratis del GitHub Student Pack, nameservers Cloudflare)
# ESP32 usa http://rebaserver.tech   (HTTP plano, puerto 80 — la placa no soporta TLS)
# Dashboard remoto usa https://rebaserver.tech (mismo tunel, edge de Cloudflare)
tunnel: 8b5b1785-5afc-42f8-a075-a3a607b615fc
credentials-file: C:\Users\sebas\.cloudflared\8b5b1785-5afc-42f8-a075-a3a607b615fc.json

ingress:
  - hostname: rebaserver.tech
    service: http://127.0.0.1:5000
    originRequest:
      # La ESP32 hace GET /api/device/config y POST /upload — timeouts holgados
      # para el upload de fotos.
      connectTimeout: 30s
      noHappyEyeballs: true
  - service: http_status:404
